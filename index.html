<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SN Notizen">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>SN Notizen</title>
<style>
/* SN Corporate Design (wie Vorlage + Montageplaner): hell, Arial, Weiß/Hellgrau, Schwarz für Text,
   SN-Dunkelgrün #006748 für Knöpfe/Aktiv, SN-Hellgrün #93C245 für Akzente und Linien, grüner Keil unten */
:root{--bg:#F2F2F2;--sf:#FFFFFF;--sf2:#F2F2F2;--ink:#000000;--mu:#5E6461;--ln:#DADADA;
--g:#006748;--gs:#E3F0D0;--hg:#93C245;--hg2:#57A04C;--warn:#C0262D;--warns:#F8DEDF;--or:#E08A00;--ors:#FCEBD0;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}
/* Kopf */
#hdr{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--ln);padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;min-height:64px}
#hdr .lg{width:46px;height:38px;object-fit:contain;flex:none}
#hdr .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#hdr h1{font-size:21px;margin:0;font-weight:bold;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .sub{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .bk{font-size:16px;color:var(--g);font-weight:bold;padding:8px 10px 8px 0;flex:none}
main{padding:calc(var(--st) + 76px) 12px calc(var(--sb) + 58px);max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main>*{flex:none}
.fw{margin-top:auto!important;padding-top:110px}
.foot{font-size:12px;color:var(--mu);padding:0 4px 6px}
.wedge{height:44px;width:100vw;margin-left:calc(50% - 50vw);background:linear-gradient(90deg,var(--hg) 0%,var(--hg2) 55%,var(--g) 100%);clip-path:polygon(0 100%,100% 0,100% 100%)}
/* Tabbar */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:var(--sb)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:11px;color:var(--mu);position:relative}
#tabs button.on{color:var(--g);font-weight:bold}
#tabs button.on::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--hg);border-radius:0 0 2px 2px}
#tabs svg{width:24px;height:24px}
#tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:bold}
/* Aktionsknöpfe */
#fabs{position:fixed;right:16px;bottom:calc(var(--sb) + 76px);z-index:19;display:flex;flex-direction:column;gap:12px;align-items:center}
.fab{width:62px;height:62px;border-radius:31px;background:var(--g);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}
.fab svg{width:30px;height:30px}
.fab.s{width:50px;height:50px;background:var(--sf);color:var(--g);border:1.5px solid var(--g);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.fab.s svg{width:24px;height:24px}
.fab:active{transform:scale(.94)}
/* Abschnitte und Karten */
.sec{margin:20px 2px 8px;display:flex;align-items:baseline;gap:8px}
.sec h2{font-size:18px;margin:0;font-weight:bold}
.sec .n{font-size:13px;color:var(--mu)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:bold}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}
.card:active{border-color:var(--mu)}
.card.star{box-shadow:inset 5px 0 0 var(--warn)}
.chk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid #B9BDBB;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on{background:var(--g);border-color:var(--g)}.chk.on svg{opacity:1}
.cb{flex:1;min-width:0}
.ct{font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.ct.ph{color:var(--mu);font-style:italic}
.card.done .ct{color:var(--mu);text-decoration:line-through}
.cm{margin-top:7px;font-size:12px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.tag.acc{background:var(--gs);color:var(--g);font-weight:bold}
.tag.p{background:var(--sf2);color:var(--ink);font-weight:bold}
.tag.star{background:var(--warn);color:#fff;font-weight:bold}
.tag.wip{background:#fff;color:var(--ink);border:1px solid var(--ink);font-weight:bold}
.tag.due.today{background:var(--ors);color:#9a5a00;font-weight:bold}.tag.due.over{background:var(--warns);color:var(--warn);font-weight:bold}
.tag.t{background:transparent;border:1px solid var(--ln)}
.th{flex:none;width:58px;height:58px;border-radius:6px;object-fit:cover;background:var(--sf2);border:1px solid var(--ln)}
.thn{position:absolute;right:16px;bottom:16px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:4px;padding:1px 5px}
.empty{text-align:center;color:var(--mu);padding:40px 20px;line-height:1.5}
.empty b{color:var(--ink);display:block;font-size:20px;margin-bottom:6px}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:3px;margin:14px 0 4px;gap:2px}
.seg button{flex:1;padding:8px 2px;border-radius:6px;font-size:13.5px;white-space:nowrap;color:var(--mu);font-weight:bold}
.seg button.on{background:var(--g);color:#fff}
.ban{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--g);border-radius:8px;padding:11px 12px 11px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;font-size:14.5px;line-height:1.35}
.ban .x{flex:1;min-width:0}.ban small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.ban.w{border-left-color:var(--or)}.ban.i{border-left-color:var(--hg)}
.btn{background:var(--sf);border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:11px 14px;font-weight:bold;font-size:15px;text-align:center;white-space:nowrap}
.btn.pr{background:var(--g);border-color:var(--g);color:#fff}
.btn.r{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:8px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns .btn{flex:1;min-width:140px}
.qbtn{display:flex;width:100%;margin:10px 0 0;background:var(--sf);border:1px dashed #B9BDBB;border-radius:8px;padding:12px;font-size:15px;color:var(--g);font-weight:bold;align-items:center;justify-content:center;gap:8px}
/* Liste (Mehr) */
.grp{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--ln);width:100%;text-align:left;font-size:16px;background:var(--sf)}
.row:last-child{border-bottom:0}
.row .l{flex:1;min-width:0;font-weight:bold}.row .s{display:block;font-size:13px;color:var(--mu);margin-top:2px;font-weight:normal}
.row .v{color:var(--mu);font-size:14px}
.row .ic{width:32px;height:32px;border-radius:6px;background:var(--gs);color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.row .ic svg{width:18px;height:18px}
.row .chev{color:#B9BDBB;font-size:22px;line-height:1}
.row.hot{box-shadow:inset 6px 0 0 var(--or)}
/* Suche */
.sbox{position:sticky;top:calc(var(--st) + 64px);z-index:5;background:var(--bg);padding:10px 0 4px}
.sin{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:12px 14px;outline:none}
.sin:focus{border-color:var(--g)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 13px;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:bold}
.chip.add{border-style:dashed;color:var(--g);font-weight:bold}
.chip.st{color:var(--warn);border-color:#E7B9B3;font-weight:bold}
.chip.st.on{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.wp.on{background:#fff;border:2px solid var(--ink);color:var(--ink);font-weight:bold}
.dtc{position:relative;overflow:hidden}.dtc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.duetxt{font-size:14px;margin:4px 2px 0;display:flex;align-items:center;gap:8px}.duetxt b{font-weight:bold}
.pin{width:100%;border:1px solid var(--ln);border-radius:8px;padding:11px 12px;background:var(--sf);outline:none;margin-top:4px}.pin:focus{border-color:var(--g)}
.log{font-size:13px;color:var(--mu);margin:4px 2px 0}
.gap{width:10px;flex:none}
/* Editor */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.edbar{flex:none;background:var(--sf);border-bottom:1px solid var(--ln);padding:calc(var(--st) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;min-height:56px}
.edbar .ti{flex:1;text-align:center;font-size:12.5px;color:var(--mu);line-height:1.3}
.edbar .ti b{color:var(--ink);font-size:15px}
.edbar .lnk{color:var(--g);font-size:16px;padding:8px 4px;min-width:84px;text-align:left;font-weight:bold}
.edbar .lnk.b{text-align:center;background:var(--g);color:#fff;border-radius:8px;padding:9px 14px;min-width:0}
.edbar .lnk.r{color:var(--warn)}
.edbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(var(--sb) + 40px);max-width:760px;width:100%;margin:0 auto}
#edText{width:100%;min-height:150px;border:1px solid var(--ln);border-radius:10px;padding:13px 14px;background:var(--sf);resize:none;line-height:1.45;outline:none;display:block}
#edText:focus{border-color:var(--g)}
.hint{font-size:12.5px;color:var(--mu);margin:6px 2px 0;display:flex;align-items:center;gap:5px}
.hint svg{width:14px;height:14px}
.phrow{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.phrow img{width:84px;height:84px;object-fit:cover;border-radius:6px;flex:none;background:var(--sf2);border:1px solid var(--ln)}
.phadd{width:84px;height:84px;border-radius:6px;border:1px dashed #B9BDBB;color:var(--g);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:bold;background:var(--sf)}
.phadd svg{width:26px;height:26px}
.fld{margin-top:12px}
.fld .lbl{margin:0 2px 2px;display:block}
.dt{flex:none;border:1px solid var(--ln);border-radius:999px;padding:5px 10px;background:var(--sf);min-height:36px}
.meta{font-size:13px;color:var(--mu);margin:16px 2px 0;line-height:1.6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.acts button{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 10px;font-size:15px;font-weight:bold;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px}
.acts button svg{width:18px;height:18px;color:var(--g)}
.acts .pri{background:var(--g);border-color:var(--g);color:#fff;grid-column:1/-1}.acts .pri svg{color:#fff}
.acts .dg{color:var(--warn)}.acts .dg svg{color:var(--warn)}
/* Foto groß */
#pv{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#pv img{flex:1;min-height:0;width:100%;object-fit:contain}
#pv .pb{display:flex;justify-content:space-between;padding:calc(var(--st) + 8px) 14px 10px}
#pv .pb button{color:#fff;font-size:17px;padding:8px;font-weight:bold}
#pv .pf{display:flex;justify-content:center;gap:12px;padding:12px 14px calc(var(--sb) + 14px)}
#pv .pf button{color:#fff;background:rgba(255,255,255,.16);padding:12px 18px;border-radius:8px;font-weight:bold}
/* Auswahl unten */
#as{position:fixed;inset:0;z-index:70;background:rgba(10,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
#as .bx{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px 12px calc(var(--sb) + 14px);animation:up .2s ease-out}
#as h3{margin:2px 4px 12px;font-size:17px;font-weight:bold}
#as .ob{display:block;width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:8px;font-size:16px;color:var(--ink);font-weight:bold;text-align:left}
#as .ob:first-of-type.go{background:var(--g);border-color:var(--g);color:#fff;text-align:center}
#as .ob.c{color:var(--mu);font-weight:normal;text-align:center;margin-top:4px}
#as input{width:100%;border:1px solid var(--ln);border-radius:8px;padding:13px;margin-bottom:10px;outline:none;background:var(--sf)}
#as input:focus{border-color:var(--g)}
/* Hinweis */
#toast{width:max-content;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 92px);z-index:80;background:var(--ink);color:#fff;border-radius:8px;padding:11px 14px;font-size:14.5px;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast button{background:var(--hg);color:#0b1a10;font-weight:bold;border-radius:5px;padding:4px 10px}
.mu{color:var(--mu)}
.month{margin:20px 2px 8px;font-size:15px;font-weight:bold}
.inf{font-size:13.5px;color:var(--mu);line-height:1.5;margin:6px 2px 12px}
@media (min-width:900px){#fabs{right:calc(50% - 380px - 90px)}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>

<div id="fabs">
  <button class="fab s" id="fabCam" aria-label="Foto aufnehmen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.8"/></svg></button>
  <button class="fab" id="fabNew" aria-label="Neue Notiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<nav id="tabs">
  <button data-tab="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>Punkte<span class="bd hidden" id="bdStart"></span></button>
  <button data-tab="suche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Suche</button>
  <button data-tab="archiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>Archiv</button>
  <button data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mehr<span class="bd hidden" id="bdMehr">!</span></button>
</nav>

<div id="ed" class="sheet hidden">
  <div class="edbar">
    <button class="lnk" id="edLeft"></button>
    <div class="ti" id="edTi"></div>
    <button class="lnk b" id="edDone">Fertig</button>
  </div>
  <div class="edbody">
    <textarea id="edText" rows="5" placeholder="Was ist dir aufgefallen?"></textarea>
    <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Diktieren: Mikrofon unten rechts auf der Tastatur</div>
    <div class="phrow" id="edPh"></div>
    <div id="edF"></div>
    <div class="meta" id="edMeta"></div>
    <div class="acts" id="edActs"></div>
  </div>
</div>

<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileAdd" accept="image/*" multiple class="hidden">
<input type="file" id="fileImp" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* =========================================================
   SN Notizen · Version 1.0
   Alle Daten bleiben auf dem Gerät (IndexedDB). Kein Server.

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];

const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoD(new Date());
const fD=ts=>{const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};
const fDT=ts=>{const d=new Date(ts);return WT[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+', '+pad(d.getHours())+':'+pad(d.getMinutes());};
const fShort=ts=>{const d=new Date(ts),n=new Date();const t=pad(d.getHours())+':'+pad(d.getMinutes());
  if(isoD(d)===isoD(n))return 'Heute '+t;const y=new Date(n);y.setDate(n.getDate()-1);if(isoD(d)===isoD(y))return 'Gestern '+t;
  return WT[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'. '+t;};
const parseIso=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const ART={aufgabe:'Aufgabe',info:'Info',idee:'Idee'};

/* ---------- Datenbank ---------- */
let db;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('sn-notizen',1);
  r.onupgradeneeded=()=>{const d=r.result;['entries','photos','termine','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode),r=fn(t.objectStore(store));
  t.oncomplete=()=>res(r&&'result'in r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbGet=(s,id)=>tx(s,'readonly',o=>o.get(id));

const E={},T={};
let M={id:'settings',bereiche:['KSF','BGV','Endmontage','Elektrowerkstatt','Kunde','Allgemein'],personen:[],activeTermin:null,lastBackup:0,deleted:{},seg:'alle'};
async function saveMeta(){await dbPut('meta',M);}
async function saveEntry(e){e.updated=Date.now();E[e.id]=e;await dbPut('entries',e);}
async function saveTermin(t){t.updated=Date.now();T[t.id]=t;await dbPut('termine',t);}
async function deleteEntry(e){for(const p of e.photos||[]){await dbDel('photos',p);dropUrl(p);}
  delete E[e.id];M.deleted[e.id]=Date.now();await dbDel('entries',e.id);await saveMeta();}

/* ---------- Fotos ---------- */
const URLS={};
function dropUrl(id){if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id];}}
async function thumbUrl(id){if(URLS[id])return URLS[id];const p=await dbGet('photos',id);if(!p)return '';return URLS[id]=URL.createObjectURL(p.thumb);}
function hydrate(root){(root||document).querySelectorAll('img[data-ph]').forEach(async img=>{const u=await thumbUrl(img.dataset.ph);if(u)img.src=u;});}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000);};i.onerror=()=>rej(new Error('Bild nicht lesbar'));i.src=u;});}
function scaleImg(img,max,q){const w=img.naturalWidth,h=img.naturalHeight,f=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*f);c.height=Math.round(h*f);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r({blob:b,w:c.width,h:c.height}),'image/jpeg',q));}
async function addPhoto(e,file){const img=await loadImg(file);const full=await scaleImg(img,1800,.82),th=await scaleImg(img,560,.78);
  const p={id:uid(),entry:e.id,full:full.blob,thumb:th.blob,w:full.w,h:full.h,tw:th.w,th:th.h,created:Date.now()};
  await dbPut('photos',p);(e.photos=e.photos||[]).push(p.id);return p;}

/* ---------- Hilfen ---------- */
const isOpen=e=>!e.done;
const isInbox=e=>!e.done&&!e.wip&&!e.art&&!e.bereich&&!e.person;
const isWip=e=>!e.done&&!!e.wip;
function dueInfo(e){if(!e.due||e.done)return null;const d=Math.round((parseIso(e.due)-parseIso(today()))/864e5);
  if(d<0)return{c:'over',t:'überfällig '+(-d)+' T'};if(d===0)return{c:'today',t:'heute fällig'};if(d===1)return{c:'',t:'morgen'};
  const x=parseIso(e.due);return{c:'',t:'bis '+WT[x.getDay()]+' '+pad(x.getDate())+'.'+pad(x.getMonth()+1)+'.'};}
function sortOpen(a,b){return (b.star?1:0)-(a.star?1:0)||((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0)||b.created-a.created;}
const firstLine=e=>(e.text||'').trim().split('\n')[0].slice(0,90)||((e.photos||[]).length?'Foto':'Ohne Text');
const openEntries=()=>Object.values(E).filter(isOpen);
function daysSince(ts){return ts?Math.floor((Date.now()-ts)/864e5):null;}
function backupDue(){const n=Object.keys(E).length;if(!n)return false;const d=daysSince(M.lastBackup);return d===null||d>=7;}

/* ---------- Zustand Ansicht ---------- */
const S={tab:'start',sub:null,q:'',f:{st:'offen',bereich:'',person:'',art:''}};

/* ---------- Karten ---------- */
const ICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function card(e,opt={}){const di=dueInfo(e),ph=e.photos||[];const tags=[];
  if(e.star)tags.push('<span class="tag star">★ Wichtig</span>');
  if(isWip(e))tags.push(`<span class="tag wip">In Arbeit${e.person?' · '+esc(e.person):''}</span>`);
  if(di)tags.push(`<span class="tag due ${di.c}">${di.t}</span>`);
  if(e.art)tags.push(`<span class="tag acc">${ART[e.art]}</span>`);
  if(e.bereich)tags.push(`<span class="tag acc">${esc(e.bereich)}</span>`);
  if(e.person&&!isWip(e))tags.push(`<span class="tag p">${esc(e.person)}</span>`);
  if(e.termin&&T[e.termin]&&!opt.noTermin)tags.push(`<span class="tag t">${esc(T[e.termin].title)}</span>`);
  const txt=(e.text||'').trim();
  return `<div class="card${e.star?' star':''}${e.done?' done':''}" data-act="open" data-id="${e.id}">
   <button class="chk${e.done?' on':''}" data-act="toggle" data-id="${e.id}" aria-label="Erledigt">${ICK}</button>
   <div class="cb"><div class="ct${txt?'':' ph'}">${txt?esc(txt):(ph.length?'Foto ohne Text':'Ohne Text')}</div>
   <div class="cm"><span>${e.done&&opt.doneDate?'erledigt '+fShort(e.done):fShort(e.created)}</span>${tags.join('')}</div></div>
   ${ph.length?`<img class="th" data-ph="${ph[0]}" alt="">${ph.length>1?`<span class="thn">+${ph.length-1}</span>`:''}`:''}</div>`;}
const list=arr=>arr.map(e=>card(e)).join('');

/* ---------- Kopf / Tabs ---------- */
function header(title,back,sub){const d=new Date();
  $('#hdr').innerHTML=(back?`<button class="bk" data-act="back">‹ Zurück</button>`:`<img class="lg" src="data:image/jpeg;base64,${LOGO}" alt="SN">`)+
  `<div class="bt"><h1>${esc(title)}</h1><span class="sub">${esc(sub||('SN Maschinenbau · '+WT[d.getDay()]+' '+fD(d)))}</span></div>`;}
const FOOT=`<div class="fw"><div class="foot">© SN Maschinenbau GmbH | Notizen</div><div class="wedge" aria-hidden="true"></div></div>`;
function badges(){const n=openEntries().filter(e=>{const d=dueInfo(e);return d&&(d.c==='over'||d.c==='today');}).length;
  const b=$('#bdStart');b.textContent=n;b.classList.toggle('hidden',!n);$('#bdMehr').classList.toggle('hidden',!backupDue());
  document.querySelectorAll('#tabs [data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));}

function render(){const m=$('#main');
  if(S.sub){renderSub(m);}
  else if(S.tab==='start')renderStart(m);else if(S.tab==='suche')renderSuche(m);else if(S.tab==='archiv')renderArchiv(m);else renderMehr(m);
  if(S.tab==='suche'&&!S.sub)$('#res').insertAdjacentHTML('afterend',FOOT);else m.insertAdjacentHTML('beforeend',FOOT);
  $('#fabs').classList.toggle('hidden',S.tab==='mehr'&&!S.sub);
  badges();hydrate(m);}

/* ---------- Start ---------- */
function renderStart(m){header('Notizen');let h='';
  if(IS_IOS&&!STANDALONE&&location.protocol==='https:')h+=`<div class="ban i"><div class="x"><b>Als App installieren:</b> unten in Safari auf <b>Teilen</b> tippen, dann <b>„Zum Home-Bildschirm“</b>.</div></div>`;
  if(backupDue()){const d=daysSince(M.lastBackup);h+=`<div class="ban w"><div class="x"><b>${d===null?'Noch keine Sicherung':'Letzte Sicherung vor '+d+' Tagen'}</b><small>Datendatei in OneDrive oder per Mail ablegen</small></div><button class="btn sm" data-act="backup">Sichern</button></div>`;}
  const at=M.activeTermin&&T[M.activeTermin];
  if(at){const n=Object.values(E).filter(e=>e.termin===at.id).length;
    h+=`<div class="ban"><div class="x"><span class="lbl" style="color:var(--g)">Läuft</span><br><b>${esc(at.title)}</b><small>${n} Punkt${n===1?'':'e'} · neue Punkte werden zugeordnet</small></div><button class="btn sm pr" data-act="endTermin">Beenden</button></div>`;}
  else h+=`<button class="qbtn" data-act="startTermin">▶ Termin / Rundgang starten</button>`;
  const open=openEntries();
  const due=open.filter(e=>{const d=dueInfo(e);return d&&(d.c==='over'||d.c==='today');}).sort(sortOpen);
  const inbox=open.filter(isInbox),wip=open.filter(isWip);
  if(due.length)h+=`<div class="sec"><h2>Fällig</h2><span class="n">${due.length}</span></div>`+list(due);
  const seg=M.seg||'alle';
  h+=`<div class="seg"><button data-act="seg" data-v="alle" class="${seg==='alle'?'on':''}">Alle ${open.length}</button><button data-act="seg" data-v="eingang" class="${seg==='eingang'?'on':''}">Eingang ${inbox.length}</button><button data-act="seg" data-v="wip" class="${seg==='wip'?'on':''}">In Arbeit ${wip.length}</button><button data-act="seg" data-v="star" class="${seg==='star'?'on':''}">★ ${open.filter(e=>e.star).length}</button></div>`;
  let arr=seg==='eingang'?inbox:seg==='wip'||seg==='offen'?wip:seg==='star'?open.filter(e=>e.star):open;
  arr=arr.slice().sort(seg==='eingang'?(a,b)=>b.created-a.created:sortOpen);
  if(!arr.length)h+=seg==='alle'?`<div class="empty"><b>Alles erledigt.</b>Mit <strong style="color:var(--g)">+</strong> schreibst oder diktierst du einen neuen Punkt,<br>mit der Kamera hältst du direkt etwas fest.</div>`:`<div class="empty">Hier ist nichts.</div>`;
  else{if(seg==='wip')h+=`<div class="inf">Aufgaben, die jemand anderes erledigt. Fälligkeit = wann du nachfasst. Im Punkt „Nachgefragt“ tippen, um es festzuhalten.</div>`;if(seg==='eingang')h+=`<div class="inf">Im Eingang landet alles, was noch keine Art, keinen Bereich und keine Person hat. Am Rechner einsortieren.</div>`;h+=list(arr);}
  m.innerHTML=h;}

/* ---------- Suche ---------- */
function matches(e,toks){const t=T[e.termin];const hay=[e.text,ART[e.art],e.bereich,e.person,t&&t.title,fD(e.created)].join(' ').toLowerCase();return toks.every(k=>hay.includes(k));}
function renderSuche(m){header('Suche');const f=S.f;
  const ch=(k,v,l)=>`<button class="chip${f[k]===v?' on':''}" data-act="filt" data-k="${k}" data-v="${esc(v)}">${esc(l)}</button>`;
  m.innerHTML=`<div class="sbox"><input class="sin" id="q" type="search" placeholder="Suchen in allen Notizen …" value="${esc(S.q)}" autocomplete="off">
   <div class="chips">${ch('st','offen','Offen')}${ch('st','wip','In Arbeit')}${ch('st','erledigt','Erledigt')}${ch('st','','Alle')}<span class="gap"></span>${Object.entries(ART).map(([k,l])=>`<button class="chip${f.art===k?' on':''}" data-act="filt" data-k="art" data-v="${f.art===k?'':k}">${l}</button>`).join('')}</div>
   <div class="chips">${M.bereiche.map(b=>`<button class="chip${f.bereich===b?' on':''}" data-act="filt" data-k="bereich" data-v="${esc(f.bereich===b?'':b)}">${esc(b)}</button>`).join('')}</div>
   ${M.personen.length?`<div class="chips">${M.personen.map(b=>`<button class="chip${f.person===b?' on':''}" data-act="filt" data-k="person" data-v="${esc(f.person===b?'':b)}">${esc(b)}</button>`).join('')}</div>`:''}</div><div id="res"></div>`;
  const q=$('#q');q.oninput=()=>{S.q=q.value;renderRes();};renderRes();}
function searchResults(){const f=S.f,toks=S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return Object.values(E).filter(e=>(f.st==='offen'?!e.done:f.st==='wip'?isWip(e):f.st==='erledigt'?!!e.done:true)&&(!f.art||e.art===f.art)&&(!f.bereich||e.bereich===f.bereich)&&(!f.person||e.person===f.person)&&matches(e,toks))
   .sort((a,b)=>(b.done||b.created)-(a.done||a.created));}
function renderRes(){const r=searchResults(),el=$('#res');
  el.innerHTML=`<div class="sec" style="align-items:center"><h2>${r.length} Treffer</h2>${r.length?`<button class="btn sm" style="margin-left:auto" data-act="pdfSearch">Als PDF</button>`:''}</div>`+(r.length?list(r):`<div class="empty">Nichts gefunden.</div>`);hydrate(el);}

/* ---------- Archiv ---------- */
function renderArchiv(m){header('Archiv');const d=Object.values(E).filter(e=>e.done).sort((a,b)=>b.done-a.done);
  if(!d.length){m.innerHTML=`<div class="empty"><b>Archiv ist leer.</b>Erledigte Punkte landen hier. Sie bleiben durchsuchbar und lassen sich mit einem Tipp auf den Haken wieder öffnen.</div>`;return;}
  let h='',cur='';for(const e of d){const x=new Date(e.done),k=MON[x.getMonth()]+' '+x.getFullYear();if(k!==cur){h+=`<div class="month">${k}</div>`;cur=k;}h+=card(e,{doneDate:1});}
  m.innerHTML=h;}

/* ---------- Mehr ---------- */

 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'};
function row(act,ic,l,s,v,extra=''){return `<button class="row" data-act="${act}" ${extra}><span class="ic">${IC[ic]}</span><span class="l">${l}${s?`<span class="s">${s}</span>`:''}</span>${v?`<span class="v">${v}</span>`:''}<span class="chev">›</span></button>`;}
async function renderMehr(m){header('Mehr');const d=daysSince(M.lastBackup);const n=Object.keys(E).length;
  const persons=M.personen.map(p=>({p,n:openEntries().filter(e=>e.person===p).length}));
  const terms=Object.values(T).sort((a,b)=>b.created-a.created).slice(0,8);
  m.innerHTML=`
  <div class="sec"><h2>An den Rechner</h2></div><div class="grp">
   ${row('sendNotebook','send','An Notebook senden','PDF der offenen Punkte + Datendatei per Mail / OneDrive')}
   ${row('pdfMenu','pdf','PDF erstellen','Offene Punkte, Eingang, Wichtiges oder Erledigtes')}
  </div>
  <div class="sec"><h2>Sicherung</h2></div><div class="grp">
   ${row('backup','save','Sicherung speichern',d===null?'Noch keine Sicherung':'Letzte vor '+(d===0?'weniger als 1 Tag':d+' Tag'+(d===1?'':'en')),'',backupDue()?'class="row hot"':'')}
   ${row('import','load','Datendatei einlesen','Vom anderen Gerät übernehmen – wird zusammengeführt')}
  </div>
  <div class="sec"><h2>Personen</h2></div><div class="grp">
   ${persons.map(x=>row('person','ppl',esc(x.p),'',x.n?x.n+' offen':'','data-v="'+esc(x.p)+'"')).join('')}
   ${row('addPerson','ppl','Person hinzufügen')}
  </div>
  <div class="sec"><h2>Termine &amp; Rundgänge</h2></div><div class="grp">
   ${terms.length?terms.map(t=>row('termin','cal',esc(t.title),fD(t.created)+(M.activeTermin===t.id?' · läuft':''),Object.values(E).filter(e=>e.termin===t.id).length+'','data-v="'+t.id+'"')).join(''):`<div class="row mu" style="cursor:default">Noch keine Termine</div>`}
   ${terms.length<Object.keys(T).length?row('alleTermine','cal','Alle Termine'):''}
  </div>

   ${row('cleanPhotos','img','Speicher aufräumen','Fotos von lange Erledigtem entfernen')}
  </div>
  <div class="inf" id="stor">${n} Einträge · Version ${APPV}<br>Alle Daten liegen nur auf diesem Gerät.</div>`;

    if(est)$('#stor').innerHTML=`${n} Einträge · ${(est.usage/1048576).toFixed(1)} MB belegt · Version ${APPV}<br>Alle Daten liegen nur auf diesem Gerät${per?' · dauerhafter Speicher aktiv':''}.`;}catch(e){}}

/* ---------- Unterseiten ---------- */
function renderSub(m){const s=S.sub;
  if(s.type==='person'){header(s.v,1);const all=openEntries().filter(e=>e.person===s.v).sort(sortOpen),w=all.filter(isWip),o=all.filter(e=>!isWip(e));
    m.innerHTML=`<div class="btns"><button class="btn pr" data-act="pdfPerson">Liste als PDF</button><button class="btn" data-act="textPerson">Als Text teilen</button></div>`+
    (w.length?`<div class="sec"><h2>In Arbeit bei ${esc(s.v)}</h2><span class="n">${w.length}</span></div>`+list(w):'')+
    `<div class="sec"><h2>Offen</h2><span class="n">${o.length}</span></div>`+(o.length?list(o):'<div class="empty">Keine offenen Punkte.</div>');}
  else if(s.type==='termin'){const t=T[s.v];if(!t){S.sub=null;return render();}header(t.title,1);
    const arr=Object.values(E).filter(e=>e.termin===t.id).sort((a,b)=>a.created-b.created);
    m.innerHTML=`<div class="inf">${fDT(t.created)}${t.closed?' bis '+fDT(t.closed).split(', ')[1]:' · läuft'}</div>
    <div class="btns"><button class="btn pr" data-act="pdfTermin">Als PDF</button><button class="btn" data-act="mdTermin">Für Obsidian kopieren</button></div>
    <div class="btns">${t.closed?`<button class="btn" data-act="reopenTermin">Wieder fortsetzen</button>`:`<button class="btn" data-act="endTermin">Beenden</button>`}<button class="btn" data-act="renameTermin">Umbenennen</button><button class="btn r" data-act="delTermin">Löschen</button></div>
    <div class="sec"><h2>Punkte</h2><span class="n">${arr.length}</span></div>`+(arr.length?arr.map(e=>card(e,{noTermin:1})).join(''):'<div class="empty">Noch keine Punkte.</div>');}
  else if(s.type==='termine'){header('Alle Termine',1);m.innerHTML='<div class="grp">'+Object.values(T).sort((a,b)=>b.created-a.created).map(t=>row('termin','cal',esc(t.title),fD(t.created),Object.values(E).filter(e=>e.termin===t.id).length+'','data-v="'+t.id+'"')).join('')+'</div>';}
  else if(s.type==='liste'){const k=s.v,arr=M[k];header(k==='bereiche'?'Bereiche':'Personen',1);
    m.innerHTML=`<div class="inf">Antippen zum Umbenennen. Einträge behalten ihre Zuordnung.</div><div class="grp">`+arr.map((x,i)=>`<div class="row"><button class="l" style="text-align:left" data-act="renItem" data-i="${i}">${esc(x)}</button><button class="v" data-act="upItem" data-i="${i}" style="padding:4px 8px">▲</button><button class="v" data-act="delItem" data-i="${i}" style="padding:4px 8px;color:var(--red)">✕</button></div>`).join('')+`</div><div class="btns"><button class="btn pr" data-act="addItem">Hinzufügen</button></div>`;}
}

/* ---------- Editor ---------- */
let ED=null,edTimer=null;
function newEntry(){const e={id:uid(),created:Date.now(),updated:Date.now(),text:'',photos:[],art:'',bereich:'',person:'',due:'',star:false,done:null,termin:(M.activeTermin&&T[M.activeTermin])?M.activeTermin:''};return e;}
function openEditor(e,isNew,focus){ED={e,isNew,saved:!isNew};$('#ed').classList.remove('hidden');document.body.style.overflow='hidden';
  const ta=$('#edText');ta.value=e.text||'';autosize();$('.edbody').scrollTop=0;

function autosize(){const ta=$('#edText');ta.style.height='auto';ta.style.height=Math.max(150,ta.scrollHeight+4)+'px';}
function renderEd(){const e=ED.e;const oldPin=$('#edPin'),pinVal=oldPin?oldPin.value:'',pinFoc=!!oldPin&&document.activeElement===oldPin;

    `<button class="phadd" data-act="camEd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.8"/></svg>Kamera</button><button class="phadd" data-act="galEd">${IC.img}Aus Fotos</button>`;
  hydrate($('#edPh'));

  const t=today(),tm=isoD(new Date(Date.now()+864e5)),nw=isoD(new Date(Date.now()+7*864e5));

  const dueTxt=(()=>{if(!e.due)return '';const x=parseIso(e.due),dd=Math.round((x-parseIso(t))/864e5);
    return `${WTL[x.getDay()]}, ${fD(x)}`+(dd===0?' (heute)':dd===1?' (morgen)':dd<0?` (vor ${-dd} Tag${dd===-1?'':'en'})`:` (in ${dd} Tagen)`);})();
  const terms=Object.values(T).filter(x=>!x.closed||x.id===e.termin).sort((a,b)=>b.created-a.created);
  $('#edF').innerHTML=`

   <div class="fld"><span class="lbl">Status</span><div class="chips wr"><button class="chip${!e.wip?' on':''}" data-act="wip" data-v="0">Mache ich selbst</button><button class="chip wp${e.wip?' on':''}" data-act="wip" data-v="1">In Arbeit bei jemand anderem</button></div></div>
   <div class="fld"><span class="lbl">${e.wip?'Wer kümmert sich?':'Person'}</span>
     ${e.person?`<div class="chips"><button class="chip on" data-act="set" data-k="person" data-v="">${esc(e.person)} ✕</button></div>`:
     `<input class="pin" id="edPin" placeholder="Name suchen oder neu anlegen …" autocomplete="off" autocapitalize="words" enterkeyhint="done"><div class="chips" id="edPs"></div>`}</div>
   <div class="fld"><span class="lbl">${e.wip?'Nachfassen am':'Fällig'}</span><div class="chips wr">${c('due',t,'Heute')}${c('due',tm,'Morgen')}${c('due',nw,'In 1 Woche')}<label class="chip dtc${e.due&&![t,tm,nw].includes(e.due)?' on':''}">Datum wählen<input type="date" id="edDue" value="${e.due||''}"></label></div>

  const ok=await shareFiles([...extra,f],'SN Notizen','');if(ok){M.lastBackup=Date.now();await saveMeta();render();toast('Gesichert');}}
async function doImport(file){try{const d=JSON.parse(await file.text());if(d.app!=='sn-notizen')throw new Error('Keine SN-Notizen-Datei');
  let neu=0,akt=0,weg=0;const del=Object.assign({},d.settings&&d.settings.deleted||{});
  for(const[k,v]of Object.entries(del))if(!M.deleted[k]||M.deleted[k]<v)M.deleted[k]=v;
  for(const e of d.entries||[]){if(M.deleted[e.id]&&M.deleted[e.id]>=e.updated)continue;const cur=E[e.id];
    if(!cur){E[e.id]=e;await dbPut('entries',e);neu++;}else if(e.updated>cur.updated){E[e.id]=e;await dbPut('entries',e);akt++;}}
  for(const e of Object.values(E))if(M.deleted[e.id]&&M.deleted[e.id]>e.updated){await deleteEntry(e);weg++;}
  for(const t of d.termine||[]){const cur=T[t.id];if(!cur||t.updated>cur.updated){T[t.id]=t;await dbPut('termine',t);}}
  const need=new Set(Object.values(E).flatMap(e=>e.photos||[]));
  for(const p of d.photos||[]){if(!need.has(p.id))continue;if(await dbGet('photos',p.id))continue;
    await dbPut('photos',{id:p.id,entry:p.entry,w:p.w,h:p.h,tw:p.tw,th:p.th,created:p.created,full:new Blob([b64bytes(p.full)],{type:'image/jpeg'}),thumb:new Blob([b64bytes(p.thumb)],{type:'image/jpeg'})});}
  for(const k of ['bereiche','personen'])for(const x of (d.settings&&d.settings[k])||[])if(!M[k].includes(x))M[k].push(x);
  await saveMeta();render();toast(`Eingelesen: ${neu} neu, ${akt} aktualisiert${weg?', '+weg+' entfernt':''}`);}
  catch(err){console.error(err);alert('Die Datei konnte nicht eingelesen werden.\n'+err.message);}}
$('#fileImp').onchange=ev=>{const f=ev.target.files[0];if(f)doImport(f);ev.target.value='';};

/* ---------- Aktionen ---------- */
async function toggleDone(e){const was=e.done;e.done=was?null:Date.now();await saveEntry(e);render();
  if(!was)toast('Erledigt – ins Archiv','Rückgängig',async()=>{e.done=null;await saveEntry(e);render();});}
async function startTermin(){const n=await ask('Termin / Rundgang starten','','Starten');if(!n)return;
  const t={id:uid(),title:n,created:Date.now(),closed:null};await saveTermin(t);M.activeTermin=t.id;await saveMeta();render();toast('Läuft: '+n);}
async function endTermin(id){const t=T[id||M.activeTermin];if(!t)return;t.closed=Date.now();await saveTermin(t);if(M.activeTermin===t.id)M.activeTermin=null;await saveMeta();render();}
async function pdfMenu(){const i=await sheet('PDF erstellen',['Alle offenen Punkte','Nur Eingang','Nur Wichtige','In Arbeit (zum Nachfassen)','Erledigt (letzte 30 Tage)']);if(i===null)return;
  const o=openEntries();const sets=[['Offene Punkte',o.sort(sortOpen)],['Eingang',o.filter(isInbox).sort((a,b)=>a.created-b.created)],['Wichtige Punkte',o.filter(e=>e.star).sort(sortOpen)],['In Arbeit',o.filter(isWip).sort(sortOpen)],
   ['Erledigt – letzte 30 Tage',Object.values(E).filter(e=>e.done&&e.done>Date.now()-30*864e5).sort((a,b)=>b.done-a.done)]];
  const[t,a]=sets[i];await sharePdf(t,`Stand ${fDT(Date.now())}  ·  ${a.length} Punkt${a.length===1?'':'e'}`,a);}
async function editList(k,act,i){const arr=M[k];const key=k==='bereiche'?'bereich':'person';
  if(act==='add'){const v=await ask(k==='bereiche'?'Neuer Bereich':'Neue Person');if(v&&!arr.includes(v))arr.push(v);}
  else if(act==='ren'){const old=arr[i],v=await ask('Umbenennen',old);if(!v||v===old)return;arr[i]=v;for(const e of Object.values(E))if(e[key]===old){e[key]=v;await saveEntry(e);}}
  else if(act==='up'&&i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];}
  else if(act==='del'){const n=Object.values(E).filter(e=>e[key]===arr[i]).length;if(!confirm(`„${arr[i]}“ entfernen?`+(n?`\n${n} Einträge behalten den Namen als Text.`:'')))return;arr.splice(i,1);}
  await saveMeta();render();}
async function cleanPhotos(){const i=await sheet('Fotos von Punkten entfernen, die erledigt sind seit …',['mehr als 3 Monaten','mehr als 6 Monaten','mehr als 12 Monaten']);if(i===null)return;
  const lim=Date.now()-[90,180,365][i]*864e5;const arr=Object.values(E).filter(e=>e.done&&e.done<lim&&(e.photos||[]).length);const n=arr.reduce((s,e)=>s+e.photos.length,0);
  if(!n)return toast('Keine passenden Fotos');if(!confirm(`${n} Foto(s) aus ${arr.length} erledigten Punkten löschen?\nDer Text bleibt erhalten. Vorher sichern empfohlen.`))return;
  for(const e of arr){for(const p of e.photos){await dbDel('photos',p);dropUrl(p);}e.photos=[];await saveEntry(e);}render();toast(n+' Fotos gelöscht');}

document.addEventListener('click',async ev=>{const tb=ev.target.closest('[data-tab]');
  if(tb){S.tab=tb.dataset.tab;S.sub=null;render();window.scrollTo(0,0);return;}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  switch(a){
   case 'open':openEditor(E[id],false,false);break;
   case 'toggle':ev.stopPropagation();toggleDone(E[id]);break;
   case 'seg':M.seg=v;saveMeta();render();break;
   case 'back':S.sub=null;render();break;
   case 'filt':S.f[b.dataset.k]=v;render();break;
   case 'startTermin':startTermin();break;
   case 'endTermin':await endTermin(S.sub&&S.sub.type==='termin'?S.sub.v:null);toast('Termin beendet');break;
   case 'reopenTermin':{const t=T[S.sub.v];if(M.activeTermin&&M.activeTermin!==t.id)await endTermin(M.activeTermin);t.closed=null;await saveTermin(t);M.activeTermin=t.id;await saveMeta();render();break;}
   case 'renameTermin':{const t=T[S.sub.v],n=await ask('Umbenennen',t.title);if(n){t.title=n;await saveTermin(t);render();}break;}
   case 'delTermin':{const t=T[S.sub.v];if(!confirm(`Termin „${t.title}“ löschen?\nDie Punkte bleiben erhalten.`))break;for(const e of Object.values(E))if(e.termin===t.id){e.termin='';await saveEntry(e);}
     delete T[t.id];await dbDel('termine',t.id);if(M.activeTermin===t.id)M.activeTermin=null;await saveMeta();S.sub=null;render();break;}
   case 'termin':S.sub={type:'termin',v};render();window.scrollTo(0,0);break;
   case 'alleTermine':S.sub={type:'termine'};render();break;
   case 'person':S.sub={type:'person',v};render();window.scrollTo(0,0);break;
   case 'addPerson':await editList('personen','add');break;
   case 'bereiche':S.sub={type:'liste',v:'bereiche'};render();break;
   case 'personen':S.sub={type:'liste',v:'personen'};render();break;
   case 'addItem':editList(S.sub.v,'add');break;
   case 'renItem':editList(S.sub.v,'ren',+b.dataset.i);break;
   case 'upItem':editList(S.sub.v,'up',+b.dataset.i);break;
   case 'delItem':editList(S.sub.v,'del',+b.dataset.i);break;
   case 'pdfTermin':{const t=T[S.sub.v],arr=Object.values(E).filter(e=>e.termin===t.id).sort((x,y)=>x.created-y.created);await sharePdf(t.title,`${fDT(t.created)}  ·  ${arr.length} Punkte`,arr,{noTermin:1});break;}
   case 'mdTermin':{const t=T[S.sub.v],arr=Object.values(E).filter(e=>e.termin===t.id).sort((x,y)=>x.created-y.created);
     await copyText(`# ${t.title}\n\n- Datum: ${fDT(t.created)}\n- Punkte: ${arr.length}\n\n`+arr.map(e=>entryMd(e,'##')).join('\n'));toast('Kopiert – in Obsidian einfügen');break;}
   case 'pdfPerson':{const arr=openEntries().filter(e=>e.person===S.sub.v).sort(sortOpen);await sharePdf('Offene Punkte – '+S.sub.v,`Stand ${fDT(Date.now())}  ·  ${arr.length} Punkte`,arr);break;}
   case 'textPerson':{const arr=openEntries().filter(e=>e.person===S.sub.v).sort(sortOpen);await shareText(listText('Offene Punkte – '+S.sub.v,arr),'Offene Punkte');break;}
   case 'pdfSearch':{const r=searchResults();await sharePdf('Suchergebnis'+(S.q?' „'+S.q+'“':''),`Stand ${fDT(Date.now())}  ·  ${r.length} Punkte`,r);break;}
   case 'pdfMenu':pdfMenu();break;
   case 'sendNotebook':{toast('Wird vorbereitet …');const o=openEntries().sort(sortOpen);const pdf=await reportPdf('Offene Punkte',`Stand ${fDT(Date.now())}  ·  ${o.length} Punkte`,o);
     await doBackup([new File([pdf],'Offene_Punkte_'+stamp()+'.pdf',{type:'application/pdf'})]);break;}
   case 'backup':doBackup();break;
   case 'import':$('#fileImp').click();break;
   case 'cleanPhotos':cleanPhotos();break;
   /* Editor */
   case 'set':{const e=ED.e,k=b.dataset.k;e[k]=e[k]===v&&k!=='due'?'':v;if(k==='due'&&b.classList.contains('on'))e.due='';e.text=$('#edText').value;await touch();renderEd();break;}
   case 'wip':{const e=ED.e;e.text=$('#edText').value;e.wip=v==='1'?(e.wip||Date.now()):null;if(e.wip&&!e.art)e.art='aufgabe';await touch();renderEd();if(e.wip&&!e.person){const p=$('#edPin');if(p)p.focus();}break;}
   case 'pickPerson':{const e=ED.e;let n=v.trim().replace(/\s+/g,' ');if(b.dataset.new)n=n.replace(/(^|[\s-])(\p{Ll})/gu,(m,a,c)=>a+c.toUpperCase());if(!n)break;if(b.dataset.new&&!M.personen.includes(n)){M.personen.push(n);M.personen.sort((a,c)=>a.localeCompare(c,'de'));await saveMeta();toast('Person angelegt: '+n);}
     e.person=n;e.text=$('#edText').value;await touch();renderEd();break;}
   case 'nachgefragt':{const e=ED.e;e.text=$('#edText').value;(e.log=e.log||[]).push({ts:Date.now(),t:'Nachgefragt'});await touch();renderEd();toast('Nachgefragt festgehalten');break;}
   case 'star':ED.e.star=!ED.e.star;ED.e.text=$('#edText').value;await touch();renderEd();break;
   case 'newOpt':{const k=b.dataset.k,lk=k==='bereich'?'bereiche':'personen';const n=await ask(k==='bereich'?'Neuer Bereich':'Neue Person');if(!n)break;
     if(!M[lk].includes(n))M[lk].push(n);await saveMeta();ED.e[k]=n;ED.e.text=$('#edText').value;await touch();renderEd();break;}
   case 'camEd':camTarget='ed';$('#fileCam').value='';$('#fileCam').click();break;
   case 'galEd':camTarget='ed';$('#fileAdd').value='';$('#fileAdd').click();break;
   case 'viewPh':viewPhoto(v);break;
   case 'edDoneToggle':{const e=ED.e;e.text=$('#edText').value;const was=e.done;e.done=was?null:Date.now();await saveEntry(e);await closeEditor();
     if(!was)toast('Erledigt – ins Archiv','Rückgängig',async()=>{e.done=null;await saveEntry(e);render();});break;}
   case 'shareEntry':{const e=ED.e;e.text=$('#edText').value;const files=[];for(const p of e.photos||[]){const x=await dbGet('photos',p);if(x)files.push(new File([x.full],'Foto_'+(files.length+1)+'.jpg',{type:'image/jpeg'}));}
     const txt=entryText(e);if(files.length&&IS_MOBILE&&navigator.canShare&&navigator.canShare({files})){try{await doShare({files,text:txt});}catch(_){} }else await shareText(txt,firstLine(e));break;}
   case 'mdEntry':{const e=ED.e;e.text=$('#edText').value;await copyText(entryMd(e));toast('Kopiert – in Obsidian einfügen');break;}
   case 'icsEntry':{const e=ED.e;e.text=$('#edText').value;const f=new File([icsFor(e)],fname(firstLine(e))+'.ics',{type:'text/calendar'});
     if(IS_IOS){const u=URL.createObjectURL(f);location.href=u;setTimeout(()=>URL.revokeObjectURL(u),60000);}else await shareFiles([f],'Kalender');break;}
   case 'delEntry':{if(!confirm('Diesen Punkt endgültig löschen?'))break;const e=ED.e;clearTimeout(edTimer);await deleteEntry(e);ED=null;$('#ed').classList.add('hidden');document.body.style.overflow='';render();toast('Gelöscht');break;}
  }});

/* ---------- Start ---------- */
(async function init(){
  try{db=await openDb();}catch(e){document.body.innerHTML='<p style="padding:40px 20px;font-family:Arial">Der Speicher dieses Browsers ist nicht verfügbar (z. B. privater Modus). Bitte normal öffnen.</p>';return;}
  const m=await dbGet('meta','settings');if(m)M=Object.assign(M,m);else await saveMeta();
  for(const e of await dbAll('entries'))E[e.id]=e;for(const t of await dbAll('termine'))T[t.id]=t;
  if(M.activeTermin&&!T[M.activeTermin])M.activeTermin=null;
  render();
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}catch(e){}
  if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(r=>{
    r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='activated'&&navigator.serviceWorker.controller)toast('Neue Version geladen','Jetzt neu starten',()=>location.reload());});});}).catch(()=>{});}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ED)render();});
})();
</script>
